<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />

    <title>PDTtoXML</title>

    <meta
      name="description"
      content="FFHS-Zwischenbericht der Semesterarbeit"
    />
    <meta
      name="Thomas Lampart"
      content="Prüfungen einfach in Moodle transferieren"
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../reveal.js/dist/reset.css" />
    <link rel="stylesheet" href="../reveal.js/dist/reveal.css" />
    <link rel="stylesheet" href="../reveal.js/dist/theme/black.css" />
    <link
      rel="stylesheet"
      href="../reveal.js/dist/plugin/highlight/monokai.css"
    />
    <link rel="stylesheet" href="../reveal.js-plugins/chalkboard/style.css" />
    <link
      rel="stylesheet"
      href="../reveal.js-plugins/customcontrols/style.css"
    />

    <!-- Font Awesome fuer Reveal-Plugins und Slide-Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <div class="reveal">
      <div class="slides">
        <section
          data-markdown="slides.md"
          data-separator="^---$"
          data-separator-vertical="^<!--\s*vertical\s*-->$"
          data-separator-notes="^Note:"
        ></section>
      </div>
    </div>

    <script src="../reveal.js/dist/reveal.js"></script>

    <script src="../reveal.js/dist/plugin/zoom.js"></script>
    <script src="../reveal.js/dist/plugin/notes.js"></script>
    <script src="../reveal.js/dist/plugin/search.js"></script>
    <script src="../reveal.js/dist/plugin/markdown.js"></script>
    <script src="../reveal.js/dist/plugin/highlight.js"></script>
    <script src="../reveal.js-plugins/chalkboard/plugin.js"></script>
    <script src="../reveal.js-plugins/customcontrols/plugin.js"></script>
    <script src="../reveal.js-plugins/loadcontent/plugin.js"></script>
    <script src="../reveal.js-plugins/animate/svg.min.js"></script>
    <script src="../reveal.js-plugins/animate/plugin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../reveal.js-plugins/chart/plugin.js"></script>
    <script src="../reveal.js-plugins/anything/plugin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js-mermaid-plugin/plugin/mermaid/mermaid.js"></script>

    <script src="../shared/config.js"></script>
  </body>
</html>
